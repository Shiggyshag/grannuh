<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granny Unblocked Game</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            max-width: 960px;
            max-height: 600px;
        }
        canvas {
            width: 100%;
            height: 100%;
            background: #231f20;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <script>
        // Directly loading CDN game engine builds to bypass firewall blockages
        var buildUrl = "https://cdn.jsdelivr.net/gh/gru6nny/ohd@main/Build";
        var loaderUrl = buildUrl + "/Granny.loader.js";
        var config = {
            dataUrl: buildUrl + "/Granny.data",
            frameworkUrl: buildUrl + "/Granny.framework.js",
            codeUrl: buildUrl + "/Granny.wasm",
            streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/gru6nny/ohd@main/StreamingAssets",
            companyName: "DVloper Cloned",
            productName: "Granny",
            productVersion: "1.0",
        };

        var canvas = document.querySelector("#unity-canvas");
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                // Game loading progress
            }).then((unityInstance) => {
                // Game loaded successfully
            }).catch((message) => {
                alert("Loading failed: " + message);
            });
        };
        document.body.appendChild(script);
    </script>

</body>
</html>
