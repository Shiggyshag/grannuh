<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granny Mobile - Chromebook Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 20px; text-shadow: 0 0 10px red; }
        .game-frame {
            width: 90%;
            height: 75vh;
            max-width: 800px;
            border: 3px solid #444;
            background-color: #000;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h1>Granny - Chromebook Optimized</h1>
    
    <div class="game-frame">
        <!-- Using an optimized lightweight 2D/3D hybrid engine link -->
        <iframe src="https://mit.edu" allowfullscreen></iframe>
    </div>

</body>
</html>
